<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>TEMO Water Club Member Login — Preview</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="premium-home.css">
<link rel="stylesheet" href="water-club.css">
</head>
<body class="premium-home water-club-page">
<main class="wc-auth-shell">
  <section class="wc-auth-card" aria-labelledby="login-title">
    <div class="wc-auth-logo"><a href="/"><img src="logo-full-320.webp" alt="TEMO Spring Water" onerror="this.onerror=null;this.src='logo-full.png';"></a></div>
    <div class="wc-kicker" style="color:var(--wc-blue);text-align:center;">TEMO Water Club</div>
    <h1 id="login-title">Member Login</h1>
    <p>Planned secure login will use your verified mobile number and OTP.</p>
    <form class="wc-auth-form" data-auth-prototype>
      <div class="wc-auth-field">
        <label for="login-phone">Mobile / WhatsApp number</label>
        <input id="login-phone" type="tel" placeholder="+92 3XX XXXXXXX" autocomplete="tel" required>
      </div>
      <button class="wc-btn wc-btn-primary" type="submit">Send secure OTP</button>
    </form>
    <div class="wc-auth-alert"><strong>Preview only:</strong> real OTP/login is intentionally disabled until the trusted backend, provider and secure sessions are connected.</div>
    <div class="wc-auth-status" role="status"></div>
    <div class="wc-auth-links">
      <a href="water-club-signup.html">New member signup</a>
      <a href="water-club-account.html">View dashboard demo</a>
      <a href="water-club.html">Back to Water Club</a>
    </div>
  </section>
</main>
<script src="water-club-auth.js"></script>
</body>
</html>
