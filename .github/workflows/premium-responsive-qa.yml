name: TEMO Premium Responsive QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'about.html'
      - 'products.html'
      - 'contact.html'
      - 'business.html'
      - 'dealer.html'
      - 'premium-redesign.css'
      - 'tests/premium-responsive.cjs'
      - '.github/workflows/premium-responsive-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  premium-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - run: node tests/premium-responsive.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temo-premium-mobile-desktop-screenshots
          path: premium-qa-screenshots/
          if-no-files-found: ignore
          retention-days: 7
